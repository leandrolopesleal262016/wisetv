<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="refresh" content="0; url=./player/admin.html" />
  <title>WiseTV Painel</title>
  <style>
    :root {
      --bg: #f4f6fb;
      --card: #ffffff;
      --text: #1a1d2a;
      --muted: #6c7285;
      --primary: #1845d8;
      --line: #e2e7f5;
      --radius: 14px;
      --shadow: 0 10px 35px rgba(14, 20, 45, 0.1);
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      background: radial-gradient(circle at top left, #eaf0ff 0%, var(--bg) 50%);
      color: var(--text);
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .card {
      width: min(520px, 100%);
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 24px;
    }

    h1 {
      margin: 0 0 10px;
      font-size: 1.4rem;
    }

    p {
      margin: 0 0 12px;
      color: var(--muted);
      line-height: 1.5;
    }

    a {
      color: var(--primary);
      font-weight: 600;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>Redirecionando para o painel atual</h1>
    <p>O WiseTV agora usa o painel em <code>/player/admin.html</code>.</p>
    <p>Se o redirecionamento nao acontecer automaticamente, abra <a id="panelLink" href="./player/admin.html">o novo painel</a>.</p>
  </main>

  <script>
    (function redirectToCurrentPanel() {
      const target = new URL("./player/admin.html", window.location.href);
      target.search = window.location.search;
      target.hash = window.location.hash;
      document.getElementById("panelLink").href = target.toString();
      window.location.replace(target.toString());
    })();
  </script>
</body>
</html>
